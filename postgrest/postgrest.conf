# PostgREST configuration
# Documentação: https://postgrest.org/en/stable/configuration.html
#
# Este arquivo é opcional — as variáveis de ambiente no docker-compose.yml
# têm precedência sobre as definições aqui.
# Use este arquivo como referência para as opções disponíveis.

# Conexão com o banco
# db-uri = "postgres://user:pass@host:5432/db"

# Schema exposto pela API
# db-schema = "public"

# Role anônima (usuários sem JWT)
# db-anon-role = "web_anon"

# Chave JWT (mínimo 32 caracteres)
# jwt-secret = "seu-segredo-jwt-aqui-minimo-32-chars"

# Porta do servidor
server-port = 3000

# Quantidade de conexões no pool
db-pool = 10

# Timeout de conexão (segundos)
db-pool-acquisition-timeout = 10

# Prefixo de log
log-level = "info"

services:
  # 1. Banco de Dados Relacional PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: elitebot-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elitebot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina a senha do banco de dados no .env.prod}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - elitebot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-elitebot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Camada API REST Automática (PostgREST v12 com RLS Ativo)
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: elitebot-postgrest-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?Defina a AUTHENTICATOR_PASSWORD no .env.prod}@postgres:5432/${POSTGRES_DB:-elitebot}
      PGRST_DB_SCHEMA: ${PGRST_DB_SCHEMA:-public}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE:-web_anon}
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?Defina o JWT Secret no .env.prod}
      PGRST_SERVER_PORT: 3000
    networks:
      - elitebot-net
    expose:
      - "3000"

  # 3. Elite Bot Worker (Crawlers, Ingestion, Redirect 3002 & Smart Alerts)
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: elitebot-worker-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-elitebot}
      POSTGREST_URL: http://postgrest:3000
      REDIRECT_PORT: 3002
      PUBLIC_REDIRECT_URL: ${PUBLIC_REDIRECT_URL:-https://click.seudominio.com}
      EVOLUTION_API_ENDPOINT: ${EVOLUTION_API_ENDPOINT}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM}
    networks:
      - elitebot-net
    expose:
      - "3002"

  # 4. OpenClaw Engine (Motor de Scraping & Automation Headless Browser)
  openclaw:
    image: openclaw/openclaw:latest
    container_name: elitebot-openclaw-prod
    restart: always
    depends_on:
      - postgres
      - worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-elitebot}
      API_BASE_URL: http://postgrest:3000
      WORKER_URL: http://worker:3002
      OPENCLAW_MODE: production
      OPENCLAW_WORKERS: 4
      HEADLESS_BROWSER: "true"
    networks:
      - elitebot-net
    expose:
      - "8080"

  # 5. Caddy Reverse Proxy (SSL Automático com HTTPS Let's Encrypt)
  caddy:
    image: caddy:2-alpine
    container_name: elitebot-caddy-prod
    restart: always
    depends_on:
      - postgrest
      - worker
      - openclaw
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - elitebot-net

networks:
  elitebot-net:
    driver: bridge

volumes:
  postgres_data_prod:
  caddy_data:
  caddy_config:
